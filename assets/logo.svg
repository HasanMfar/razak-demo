<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="100%" height="100%">
  <defs>
    <!-- Premium Gradient -->
    <linearGradient id="main-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34d399" />
      <stop offset="50%" stop-color="#0ea5e9" />
      <stop offset="100%" stop-color="#6366f1" />
    </linearGradient>
    
    <linearGradient id="shackle-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#6ee7b7" />
      <stop offset="100%" stop-color="#7dd3fc" />
    </linearGradient>

    <!-- Drop Shadow -->
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#0369a1" flood-opacity="0.35" />
    </filter>
  </defs>

  <g filter="url(#shadow)">
    <!-- Lock Shackle -->
    <path d="M 36 45 V 32 C 36 15, 84 15, 84 32 V 45" fill="none" stroke="url(#shackle-grad)" stroke-width="14" stroke-linecap="round" />

    <!-- Shield/Leaf Body -->
    <path d="M 60 115 C 108 100, 114 65, 114 45 C 114 36, 108 30, 96 30 H 24 C 12 30, 6 36, 6 45 C 6 65, 12 100, 60 115 Z" fill="url(#main-grad)" />
    
    <!-- Layered Leaf Detail (Hop Cone) -->
    <path d="M 60 115 C 88 100, 94 65, 94 45 H 26 C 26 65, 32 100, 60 115 Z" fill="#ffffff" opacity="0.15" />
    <path d="M 60 115 C 76 100, 80 65, 80 45 H 40 C 40 65, 44 100, 60 115 Z" fill="#ffffff" opacity="0.25" />
  </g>

  <!-- Glowing Keyhole -->
  <circle cx="60" cy="62" r="8" fill="#ffffff" />
  <path d="M 55 67 L 65 67 L 69 90 L 51 90 Z" fill="#ffffff" />
  
  <!-- Subtle Reflections -->
  <path d="M 14 45 C 14 62, 20 85, 45 102" fill="none" stroke="#ffffff" stroke-width="2" stroke-linecap="round" opacity="0.5" />
  <circle cx="98" cy="42" r="2.5" fill="#ffffff" opacity="0.8" />
</svg>