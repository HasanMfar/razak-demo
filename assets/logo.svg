<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 160" width="100%" height="100%">
  <defs>
    <!-- Ambient Atmospheric Glow -->
    <filter id="emerald-glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#059669" flood-opacity="0.45" />
    </filter>

    <!-- Glass Highlights & Gradients -->
    <!-- Outer Wings / Base Bracts -->
    <linearGradient id="hop-wing-left" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34d399" />
      <stop offset="50%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#047857" />
    </linearGradient>

    <linearGradient id="hop-wing-right" x1="100%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#6ee7b7" />
      <stop offset="50%" stop-color="#059669" />
      <stop offset="100%" stop-color="#064e3b" />
    </linearGradient>

    <!-- Mid Tier Bracts (Luminous Teal) -->
    <linearGradient id="hop-mid-left" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#67e8f9" />
      <stop offset="60%" stop-color="#06b6d4" />
      <stop offset="100%" stop-color="#0e7490" />
    </linearGradient>

    <linearGradient id="hop-mid-right" x1="100%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#a7f3d0" />
      <stop offset="50%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#047857" />
    </linearGradient>

    <!-- Center Crown Bud (Crystal Heart) -->
    <linearGradient id="hop-crown" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="40%" stop-color="#67e8f9" />
      <stop offset="100%" stop-color="#10b981" />
    </linearGradient>

    <!-- Inner Keyhole Glow -->
    <linearGradient id="core-light" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#a7f3d0" />
    </linearGradient>
  </defs>

  <!-- Ambient Backdrop Light Flare -->
  <circle cx="80" cy="85" r="46" fill="#10b981" opacity="0.25" filter="url(#emerald-glow)" />

  <!-- The Iconic Layered Razak Hop Cone (Modern, Harmonious & Organic) -->
  <g filter="url(#emerald-glow)">
    
    <!-- 1. Bottom Base Scale (The Foundation / Shield Tip) -->
    <path d="M 80 144 C 68 136, 52 118, 56 102 C 60 88, 74 84, 80 94 C 86 84, 100 88, 104 102 C 108 118, 92 136, 80 144 Z" 
          fill="#064e3b" opacity="0.9" />

    <!-- 2. Outer Lower Left Leaf -->
    <path d="M 32 82 C 28 66, 44 48, 62 56 C 76 62, 78 80, 68 96 C 58 110, 36 98, 32 82 Z" 
          fill="url(#hop-wing-left)" />

    <!-- 3. Outer Lower Right Leaf -->
    <path d="M 128 82 C 132 66, 116 48, 98 56 C 84 62, 82 80, 92 96 C 102 110, 124 98, 128 82 Z" 
          fill="url(#hop-wing-right)" />

    <!-- 4. Mid Tier Left Leaf (Curving inward, elegant & silky) -->
    <path d="M 46 54 C 44 38, 62 26, 76 36 C 88 44, 86 64, 74 76 C 62 86, 48 70, 46 54 Z" 
          fill="url(#hop-mid-left)" opacity="0.95" />

    <!-- 5. Mid Tier Right Leaf (Overlapping symmetry) -->
    <path d="M 114 54 C 116 38, 98 26, 84 36 C 72 44, 74 64, 86 76 C 98 86, 112 70, 114 54 Z" 
          fill="url(#hop-mid-right)" opacity="0.95" />

    <!-- 6. Top Central Bud / Crown Scale -->
    <path d="M 80 16 C 92 16, 102 28, 98 44 C 94 58, 80 72, 80 72 C 80 72, 66 58, 62 44 C 58 28, 68 16, 80 16 Z" 
          fill="url(#hop-crown)" />

    <!-- 7. Center Embedded Keyhole Portal (Subtle & Clever Auth Metaphor) -->
    <!-- Head circle of keyhole -->
    <circle cx="80" cy="80" r="7.5" fill="#090d16" />
    <circle cx="80" cy="80" r="5.5" fill="url(#core-light)" />
    <!-- Slot stem of keyhole -->
    <path d="M 78 84 L 82 84 L 83.5 98 C 83.5 100, 76.5 100, 76.5 98 Z" fill="url(#core-light)" />
  </g>

  <!-- Specular Reflection Highlight (Curved glass sheen) -->
  <path d="M 52 38 C 58 32, 68 26, 80 26" fill="none" stroke="#ffffff" stroke-width="2.5" stroke-linecap="round" opacity="0.6" />
  <circle cx="108" cy="46" r="2.5" fill="#ffffff" opacity="0.85" />
</svg>