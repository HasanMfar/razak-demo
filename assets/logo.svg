<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 240" width="100%" height="100%">
  <defs>
    <!-- Ambient Depth Shadow -->
    <filter id="soft-glow" x="-25%" y="-25%" width="150%" height="150%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#059669" flood-opacity="0.4" />
    </filter>

    <!-- Inner Glow / Specular Reflection -->
    <filter id="glass-inner">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in2="SourceAlpha" operator="arithmetic" k2="-1" k3="1" result="shadowDiff" />
      <feFlood flood-color="#ffffff" flood-opacity="0.6" />
      <feComposite in2="shadowDiff" operator="in" />
      <feComposite in2="SourceGraphic" operator="over" />
    </filter>

    <!-- Gradients -->
    <linearGradient id="bg-squircle" x1="10%" y1="10%" x2="90%" y2="90%">
      <stop offset="0%" stop-color="#10b981" />
      <stop offset="45%" stop-color="#059669" />
      <stop offset="100%" stop-color="#044e39" />
    </linearGradient>

    <linearGradient id="rim-stroke" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="rgba(255, 255, 255, 0.85)" />
      <stop offset="50%" stop-color="rgba(255, 255, 255, 0.25)" />
      <stop offset="100%" stop-color="rgba(16, 185, 129, 0.2)" />
    </linearGradient>

    <!-- Layer Gradients for Organic Razak Hop Petals -->
    <linearGradient id="petal-top" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#a7f3d0" />
      <stop offset="100%" stop-color="#34d399" />
    </linearGradient>

    <linearGradient id="petal-mid-left" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#67e8f9" />
      <stop offset="100%" stop-color="#06b6d4" />
    </linearGradient>

    <linearGradient id="petal-mid-right" x1="100%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#34d399" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>

    <linearGradient id="petal-bottom" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#2563eb" />
    </linearGradient>

    <!-- Key & Sparkle Gradient -->
    <linearGradient id="gold-sparkle" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#ecfdf5" />
    </linearGradient>
  </defs>

  <!-- 1. Smooth Rounded Squircle Canvas with Drop Shadow -->
  <g filter="url(#soft-glow)">
    <rect x="30" y="30" width="180" height="180" rx="54" fill="url(#bg-squircle)" />
    <rect x="31" y="31" width="178" height="178" rx="53" fill="none" stroke="url(#rim-stroke)" stroke-width="2" />
  </g>

  <!-- 2. Gentle Top Highlight Glare -->
  <path d="M 64 34 C 48 34, 38 46, 35 60 C 50 56, 85 52, 120 52 C 155 52, 190 56, 205 60 C 202 46, 192 34, 176 34 Z" 
        fill="#ffffff" opacity="0.22" />

  <!-- 3. Organic Layered Razak Bracts (Gentle, Natural & Delightful) -->
  <!-- Topmost Crown Petal -->
  <path d="M 120 62 C 134 62, 148 76, 142 92 C 136 106, 120 112, 120 112 C 120 112, 104 106, 98 92 C 92 76, 106 62, 120 62 Z" 
        fill="url(#petal-top)" opacity="0.95" />

  <!-- Left Wing Petal (Curving in) -->
  <path d="M 86 92 C 102 92, 114 104, 114 118 C 114 132, 98 144, 84 144 C 70 144, 66 128, 70 114 C 74 100, 78 92, 86 92 Z" 
        fill="url(#petal-mid-left)" opacity="0.9" />

  <!-- Right Wing Petal (Curving in to meet Left, forming heart/R-shape) -->
  <path d="M 154 92 C 162 92, 166 100, 170 114 C 174 128, 170 144, 156 144 C 142 144, 126 132, 126 118 C 126 104, 138 92, 154 92 Z" 
        fill="url(#petal-mid-right)" opacity="0.9" />

  <!-- Bottom Core Bract -->
  <path d="M 120 116 C 142 116, 154 134, 146 154 C 138 172, 120 178, 120 178 C 120 178, 102 172, 94 154 C 86 134, 98 116, 120 116 Z" 
        fill="url(#petal-bottom)" opacity="0.85" />

  <!-- 4. Pure Luminous Center Auth Jewel (Friendly, Glowing & Warm) -->
  <g filter="url(#glass-inner)">
    <!-- Central Smooth Pill/Keyhole Base -->
    <circle cx="120" cy="116" r="13" fill="url(#gold-sparkle)" />
    <!-- Modern Key Slit -->
    <path d="M 117 122 L 123 122 L 125 138 C 125 141, 115 141, 115 138 Z" fill="url(#gold-sparkle)" />
  </g>

  <!-- 5. Cheerful Sparkle Glints -->
  <circle cx="156" cy="80" r="3" fill="#ffffff" opacity="0.9" />
  <circle cx="84" cy="154" r="2.5" fill="#ffffff" opacity="0.8" />
  <path d="M 166 68 Q 170 70 172 74 Q 170 78 166 80 Q 162 78 160 74 Q 162 70 166 68 Z" fill="#ffffff" opacity="0.9" />
</svg>