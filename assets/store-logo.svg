<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 280 80" width="100%" height="100%">
  <defs>
    <!-- Vibrant Store Bag Gradient (Modern Indigo & Coral) -->
    <linearGradient id="bag-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6366f1" />
      <stop offset="100%" stop-color="#4338ca" />
    </linearGradient>

    <linearGradient id="handle-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f43f5e" />
      <stop offset="100%" stop-color="#fb7185" />
    </linearGradient>

    <filter id="bag-shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#4f46e5" flood-opacity="0.35" />
    </filter>
  </defs>

  <!-- Bag Icon -->
  <g filter="url(#bag-shadow)">
    <!-- Main Bag Shape -->
    <rect x="18" y="24" width="44" height="46" rx="12" fill="url(#bag-grad)" />
    <!-- Cheerful Handle -->
    <path d="M 30 24 V 16 C 30 10.5, 50 10.5, 50 16 V 24" fill="none" stroke="url(#handle-grad)" stroke-width="4.5" stroke-linecap="round" />
    <!-- White Minimal Smile Cut on Bag -->
    <path d="M 28 42 C 34 50, 46 50, 52 42" fill="none" stroke="#ffffff" stroke-width="3" stroke-linecap="round" opacity="0.9" />
  </g>

  <!-- Store Typography (Independent Real E-Commerce Brand) -->
  <text x="78" y="44" fill="#ffffff" font-size="22" font-weight="900" font-family="system-ui, -apple-system, sans-serif">فروشگاه دیجی‌استور</text>
  <text x="78" y="64" fill="#94a3b8" font-size="12" font-weight="600" font-family="system-ui, -apple-system, sans-serif">DIGISTORE • خرید آسان و مطمئن</text>
</svg>