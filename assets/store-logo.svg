<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 280 80" width="100%" height="100%">
  <defs>
    <linearGradient id="store-bag-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#06b6d4" />
    </linearGradient>
    <linearGradient id="store-handle-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34d399" />
      <stop offset="100%" stop-color="#38bdf8" />
    </linearGradient>
    <filter id="store-shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#10b981" flood-opacity="0.3" />
    </filter>
  </defs>

  <!-- Bag Icon with Shadow -->
  <g filter="url(#store-shadow)">
    <!-- Bag Body with rounded corners -->
    <rect x="18" y="24" width="44" height="46" rx="12" fill="url(#store-bag-grad)" />
    
    <!-- Bag Handle -->
    <path d="M 30 24 V 17 C 30 11.5, 50 11.5, 50 17 V 24" fill="none" stroke="url(#store-handle-grad)" stroke-width="4.5" stroke-linecap="round" />
    
    <!-- Bag Front Fold Line -->
    <path d="M 24 38 Q 40 45 56 38" fill="none" stroke="rgba(255, 255, 255, 0.4)" stroke-width="2.5" stroke-linecap="round" />
    
    <!-- Mini Star Sparkle on Bag -->
    <circle cx="48" cy="54" r="3" fill="#ffffff" />
  </g>

  <!-- Store Text Typography (Persian & Clean) -->
  <text x="80" y="44" fill="#ffffff" font-size="22" font-weight="900" font-family="system-ui, -apple-system, sans-serif">فروشگاه آنلاین</text>
  <text x="80" y="64" fill="#94a3b8" font-size="12" font-weight="600" font-family="system-ui, -apple-system, sans-serif">تجربه خرید هوشمند با رازک</text>
</svg>